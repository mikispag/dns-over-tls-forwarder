name: release

# Pushing a vX.Y.Z tag publishes a release whose notes are the annotated tag
# message. A manual run builds and packages without publishing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (linux/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Go stamps the module version from the tag, which needs history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          # Release builds do not trust caches written by other workflows.
          cache: false

      - name: Test
        if: matrix.goarch == 'amd64'
        run: go vet ./... && go test ./...

      - name: Build static binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags='-s -w' -o dist/dns-over-tls-forwarder .

      - name: Check embedded version
        if: github.ref_type == 'tag'
        run: |
          got=$(go version -m dist/dns-over-tls-forwarder | awk '$1 == "mod" { print $3 }')
          if [ "$got" != "$GITHUB_REF_NAME" ]; then
            echo "::error::binary reports version '$got', want '$GITHUB_REF_NAME'"
            exit 1
          fi

      - name: Package
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=0.0.0-snapshot.${GITHUB_SHA::12}
          fi
          name=dns-over-tls-forwarder_${version}_linux_${GOARCH}
          mkdir "dist/$name"
          mv dist/dns-over-tls-forwarder "dist/$name/"
          cp LICENSE README.md debian/dns-over-tls-forwarder.service "dist/$name/"
          # Reproducible archive: fixed order, timestamps, and ownership.
          epoch=$(git log -1 --format=%ct)
          tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner \
            --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime \
            -C dist -cf - "$name" | gzip -9n > "dist/$name.tar.gz"
          tar -tzvf "dist/$name.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz | tee SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checkout fetched the annotated tag; its body is the release notes.
          git fetch --no-tags origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git for-each-ref --format='%(contents:body)' "refs/tags/$GITHUB_REF_NAME" > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::tag $GITHUB_REF_NAME has no release notes in its message"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md dist/*.tar.gz dist/SHA256SUMS
